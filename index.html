<html lang="ja">
<head>
<meta charset="UTF-8">
<title>VR フォトガチャ</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>

<a-scene cursor="rayOrigin: mouse">

    <!-- 写真 -->
    <a-assets>
        <img id="p1" src="photo1.jpg">
        <img id="p2" src="photo3.jpg">
        <img id="p3" src="photo4.jpg">
        <img id="p4" src="photo5.jpg">
        <img id="p5" src="photo7.jpg">
        <img id="p6" src="photo9.jpg">
        <img id="p7" src="photo10.jpg">
        <img id="p8" src="photo11.jpg">
        <img id="p9" src="photo12.jpg">
        <img id="p10" src="photo13.jpg">
        <img id="p11" src="photo14.jpg">
        <img id="p12" src="photo15.jpg">
        <img id="p13" src="photo16.jpg">
        <img id="p14" src="photo19.jpg">
        <img id="p15" src="photo20.jpg">
        <img id="p16" src="photo21.jpg">
        <img id="p17" src="photo23.jpg">
        <img id="p18" src="photo24.jpg">
        <img id="p19" src="photo27.jpg">
        <img id="p20" src="photo29.jpg">
        <img id="p21" src="photo30.jpg">
        <img id="p22" src="photo31.jpg">
        <img id="p23" src="photo33.JPEG">
        <img id="p24" src="photo35.jpg">
        <img id="p25" src="photo37.jpg">
        <img id="p26" src="photo38.jpg">
        <img id="p27" src="photo39.jpg">
        <img id="p28" src="photo40.jpg">
        <img id="p29" src="photo41.jpg">
        <img id="p30" src="photo42.jpg">

    </a-assets>

    <!-- 空 -->
    <a-sky color="#dff4ff"></a-sky>

    <!-- 床 -->
    <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#f5f5f5">
    </a-plane>

    <!-- タイトル -->
    <a-text
        value="VR PHOTO GACHA"
        position="0 5.5 -5"
        align="center"
        color="#4a6fa5"
        scale="2.5 2.5 2.5">
    </a-text>
    
    <!-- 写真タイトル -->
    <a-text
        id="title"
        value=""
        position="0 4.8 -5"
        align="center"
        color="#333333"
        scale="1.4 1.4 1.4">
    </a-text>

    <!-- 写真の枠 -->
    <a-plane
        position="0 2.9 -5.02"
        width="3.25"
        height="3.25"
        color="white">
    </a-plane>

    <!-- 写真 -->
    <a-plane
        id="photo"
        visible="false"
        position="0 2.9 -5"
        width="3"
        height="3">
    </a-plane>

    <!-- ボタン土台 -->
    <a-cylinder
        position="0 0.95 -3"
        radius="0.7"
        height="0.15"
        color="#4aaee8">
    </a-cylinder>

    <!-- ガチャボタン -->
    <a-cylinder
        id="gacha"
        position="0 1.1 -3"
        radius="0.5"
        height="0.18"
        color="#6ec6ff">
    </a-cylinder>

    <!-- 説明 -->
    <a-text
        value="Push the Button!"
        position="0 0.3 -3"
        align="center"
        color="#666666"
        scale="1 1 1">
    </a-text>
   
    <!-- コレクションの背景 左側 -->
    <a-plane
    	position="-4.5 2.8 -5.01"
    	width="3.6"
    	height="5.9"
    	color="#7596C7">
	</a-plane>
	
	<!-- コレクションの背景 右側 -->
	<a-plane
    	position="4.5 2.8 -5.01"
    	width="3.6"
    	height="5.9"
    	color="#7596C7">
	</a-plane>
	
    <!-- コレクションの設定 左 -->
    <a-text
    	value="COLLECTION"
    	position="-4.5 6.0 -5"
    	align="center"
    	color="#C883F6"
    	scale="1.2 1.2 1.2">
	</a-text>
	
    <!-- コレクションの設定 右 -->
    <a-text
        value="COLLECTION"
        position="4.5 6.0 -5"
        align="center"
        color="#C883F6"
        scale="1.3 1.3 1.3">
    </a-text>
    
    <!-- コレクションの設定 -->
    <a-plane id="c1" position="-5.6 5.0 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c2" position="-4.5 5.0 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c3" position="-3.4 5.0 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
	<a-plane id="c4" position="-5.6 3.9 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c5" position="-4.5 3.9 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c6" position="-3.4 3.9 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
	<a-plane id="c7" position="-5.6 2.8 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c8" position="-4.5 2.8 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c9" position="-3.4 2.8 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
	<a-plane id="c10" position="-5.6 1.7 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c11" position="-4.5 1.7 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c12" position="-3.4 1.7 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
	<a-plane id="c13" position="-5.6 0.6 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c14" position="-4.5 0.6 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c15" position="-3.4 0.6 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
	
	
	<a-plane id="c16" position="3.4 5.0 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c17" position="4.5 5.0 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c18" position="5.6 5.0 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
	<a-plane id="c19" position="3.4 3.9 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c20" position="4.5 3.9 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c21" position="5.6 3.9 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
	<a-plane id="c22" position="3.4 2.8 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c23" position="4.5 2.8 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c24" position="5.6 2.8 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
	<a-plane id="c25" position="3.4 1.7 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c26" position="4.5 1.7 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c27" position="5.6 1.7 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
	<a-plane id="c28" position="3.4 0.6 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c29" position="4.5 0.6 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	<a-plane id="c30" position="5.6 0.6 -5" width="0.9" height="0.9" color="#CCCCFF"></a-plane>
	
    <!-- コントローラ -->
    <a-entity
        id="ctlR"
        laser-controls="hand: right"
        raycaster="lineColor: red">
    </a-entity>

    <a-entity
        id="ctlL"
        laser-controls="hand: left"
        raycaster="lineColor: yellow">
    </a-entity>

</a-scene>

<script>

var photos=[
{
image:"#p1",
title:"Red Plum"
},
{
image:"#p2",
title:"Colorful Shrimp"
},
{
image:"#p3",
title:"Mysterious Tunnel Light"
},
{
image:"#p4",
title:"Red Heart"
},
{
image:"#p5",
title:"Azalea?"
},
{
image:"#p6",
title:"Sweet Tomato"
},
{
image:"#p7",
title:"First Cake"
},
{
image:"#p8",
title:"Virtual Avatar"
},
{
image:"#p9",
title:"Amber Sunset"
},
{
image:"#p10",
title:"Sparkler"
},
{
image:"#p11",
title:"Golden Yellow"
},
{
image:"#p12",
title:"High Key"
},
{
image:"#p13",
title:"Low Key"
},
{
image:"#p14",
title:"Corner Colors"
},
{
image:"#p15",
title:"Candy Apple"
},
{
image:"#p16",
title:"Atago Shrine"
},
{
image:"#p17",
title:"Blurry Cat"
},
{
image:"#p18",
title:"Eden"
},
{
image:"#p19",
title:"Funny Pineapple"
},
{
image:"#p20",
title:"Spinning Penguin"
},
{
image:"#p21",
title:"Colorful Soda"
},
{
image:"#p22",
title:"Laser Beam"
},
{
image:"#p23",
title:"Hydrangea"
},
{
image:"#p24",
title:"Night Sakura"
},
{
image:"#p25",
title:"Chocolate Battle"
},
{
image:"#p26",
title:"Chatty Goat"
},
{
image:"#p27",
title:"Tokigawa River"
},
{
image:"#p28",
title:"Garden Parade"
},
{
image:"#p29",
title:"Winter at Kiyotsu Gorge"
},
{
image:"#p30",
title:"Garden Makeover"
},
];


var collected=[];

$("#gacha").on("click",function(){

    // ボタン演出
    $("#gacha").attr(
        "color",
        "#6BA1FF"
    );

    setTimeout(function(){

        $("#gacha").attr(
            "color",
            "#6ec6ff"
        );

    },300);

    // ランダム
    var r=Math.floor(Math.random()*photos.length);

    // 写真表示
    $("#photo").attr(
        "src",
        photos[r].image
    );

    $("#photo").attr(
        "visible",
        "true"
    );

    // タイトル表示
    $("#title").attr(
        "value",
        photos[r].title
    );

    // コレクション追加（重複なし）
    if(collected.includes(r)==false){

        collected.push(r);

        $("#c"+(r+1)).attr(
            "src",
            photos[r].image
        );

        $("#c"+(r+1)).attr(
            "color",
            "white"
        );

    }

});
</script>

</body>
</html>
