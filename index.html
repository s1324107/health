<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MealMate AI 日本料理認識テスト</title><style>body{background:#f0f8fa;color:#163b4c;font-family:system-ui,sans-serif;margin:0;padding:24px}.app{max-width:600px;margin:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 8px 32px #1233}h1{margin-top:0}input,button{font-size:1rem;padding:12px}button{background:#237d96;color:white;border:0;border-radius:10px;cursor:pointer}.hint{color:#536b76;font-size:0.9rem}img{max-width:100%;max-height:320px;border-radius:12px}#result{white-space:pre-line;line-height:1.85}</style></head><body><div class="app"><h1>🍙 MealMate AI | 精度テスト</h1><p>写真を選んで、日本料理専用モデルの予測を確認できます。</p><input id="photo" type="file" accept="image/*"><p><img id="preview" alt="選んだ料理の写真"></p><button id="predict">AIで判定する</button><p id="status" class="hint">学習済みのmodelファイルが必要です。</p><div id="result" aria-live="polite"></div><p class="hint">※「%」はモデルの予測スコアで、正解率を保証しません。対応外の食品は誤判定する可能性があります。</p></div><script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script><script src="app.js"></script></body></html>
